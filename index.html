<CodeBlock language="html" editable>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Wrenchly – Your Car Companion</title>
<style>
:root{--bg:#0b1120;--panel:#151f30;--panel2:#1c293c;--text:#f2f5fa;--muted:#a5b2c5;--blue:#55a6ff;--green:#42d39a;--orange:#ffb454;--red:#ff7070}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,-apple-system,sans-serif}
header{padding:22px 18px 14px;background:#111b2b;position:sticky;top:0;z-index:3;border-bottom:1px solid #26354b}
.brand{font-size:25px;font-weight:850;letter-spacing:-1px}
.brand span{color:var(--blue)}
header p{margin:3px 0;color:var(--muted);font-size:12px}
main{max-width:720px;margin:auto;padding:17px 15px 100px}
.hero{background:linear-gradient(135deg,#1b3859,#142235);padding:22px;border-radius:18px;margin-bottom:18px}
.eyebrow{color:#a9d5ff;font-size:11px;font-weight:800;letter-spacing:1px}
h1{font-size:28px;margin:8px 0 4px}
h2{font-size:21px;margin:22px 0 12px}
h3{font-size:16px;margin:0 0 7px}
p{line-height:1.55}
.muted{color:var(--muted);font-size:13px}
.badge{display:inline-block;background:#173c36;color:#8df0c4;padding:5px 9px;border-radius:30px;font-size:11px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--panel);border:1px solid #26354b;border-radius:14px;padding:15px;margin-bottom:10px}
.tile{min-height:112px;text-align:left;color:var(--text);cursor:pointer}
.tile .ico{font-size:25px;display:block;margin-bottom:10px}
button{font:inherit}
button.primary,.tile,.action{border:0;border-radius:12px}
button.primary{background:var(--blue);color:#071525;font-weight:800;padding:12px 16px;cursor:pointer}
button.secondary{background:var(--panel2);color:var(--text);border:1px solid #33435a;border-radius:10px;padding:10px;cursor:pointer}
nav{position:fixed;bottom:0;left:0;right:0;background:#111b2b;border-top:1px solid #26354b;display:flex;justify-content:space-around;padding:9px 3px calc(9px + env(safe-area-inset-bottom));z-index:5}
nav button{background:none;border:0;color:var(--muted);font-size:11px;padding:6px 4px;cursor:pointer}
nav button.active{color:var(--blue);font-weight:800}
nav span{display:block;font-size:20px;margin-bottom:2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
input,textarea,select{width:100%;background:#0e1828;color:var(--text);border:1px solid #35465e;border-radius:10px;padding:12px;font:inherit;margin:6px 0 12px}
label{display:block;color:var(--muted);font-size:13px;margin-top:10px}
.item{padding:13px 0;border-bottom:1px solid #2a394d}
.item:last-child{border:0}
.check{display:flex;gap:10px;align-items:flex-start;line-height:1.4;padding:10px 0}
.check input{width:19px;height:19px;margin:2px 0;accent-color:var(--green)}
.notice{background:#34291b;border:1px solid #73532c;padding:13px;border-radius:12px;color:#ffdaa4;font-size:13px;line-height:1.5}
.danger{background:#391f28;border:1px solid #783c4a;padding:13px;border-radius:12px;color:#ffc0c0;font-size:13px}
.hidden{display:none!important}
ul{padding-left:20px;line-height:1.7}
footer{text-align:center;color:var(--muted);font-size:11px;padding:25px}
</style>
</head>
<body>
